name: GPUI feature matrix

on:
  pull_request:
  push:
    branches:
      - main
      - develop/0.9

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  upstream-provenance:
    name: Upstream provenance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch audited Zed history without blobs
        shell: bash
        run: |
          audited_commit="$(jq -r '.audited_upstream' docs/sync/upstream-audit.json)"
          git init "$RUNNER_TEMP/zed-upstream"
          git -C "$RUNNER_TEMP/zed-upstream" remote add origin https://github.com/zed-industries/zed.git
          git -C "$RUNNER_TEMP/zed-upstream" fetch --filter=blob:none origin "$audited_commit"
          git -C "$RUNNER_TEMP/zed-upstream" checkout --detach FETCH_HEAD

      - name: Verify classifications and Zed-Origin trailers
        env:
          UPSTREAM_REPO: ${{ runner.temp }}/zed-upstream
        run: scripts/verify-upstream-sync.sh

  format:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1 with rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  workflow-hygiene:
    name: Workflow and shell hygiene
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck scripts/*.sh

      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@e639db99335bc9038abc0e066dfcd72e23d26fb4 # v0.3.0
        with:
          advanced-security: false
          online-audits: false
          min-severity: high
          version: 1.9.0

  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / workspace tests
            os: ubuntu-24.04
            cache-key: linux-workspace-tests
            linux-native: true
            examples: true
            command: cargo test --workspace --lib --tests --locked -- --test-threads=1
          - name: Linux / no default features
            os: ubuntu-24.04
            cache-key: linux-no-default
            linux-native: false
            command: cargo check -p adabraka-gpui --lib --no-default-features --locked
          - name: Linux / feature contracts
            os: ubuntu-24.04
            cache-key: linux-feature-contracts
            linux-native: true
            command: bash scripts/verify-features.sh
          - name: Linux / accessibility + X11
            os: ubuntu-24.04
            cache-key: linux-accessibility-x11
            linux-native: true
            command: cargo check -p adabraka-gpui --lib --no-default-features --features accessibility,font-kit,x11 --locked
          - name: Linux / accessibility + Wayland
            os: ubuntu-24.04
            cache-key: linux-accessibility-wayland
            linux-native: true
            command: cargo check -p adabraka-gpui --lib --no-default-features --features accessibility,font-kit,wayland --locked
          - name: macOS / workspace tests
            os: macos-14
            cache-key: macos-workspace-tests
            linux-native: false
            examples: true
            command: cargo test --workspace --lib --tests --locked -- --test-threads=1
          - name: macOS / no default features
            os: macos-14
            cache-key: macos-no-default
            linux-native: false
            command: cargo check -p adabraka-gpui --lib --no-default-features --locked
          - name: Windows / workspace tests
            os: windows-2022
            cache-key: windows-workspace-tests
            linux-native: false
            examples: true
            command: cargo test --workspace --lib --tests --locked -- --test-threads=1
          - name: Windows / no default features
            os: windows-2022
            cache-key: windows-no-default
            linux-native: false
            command: cargo check -p adabraka-gpui --lib --no-default-features --locked
          - name: Windows / real visual smoke
            os: windows-2022
            cache-key: windows-real-visual
            linux-native: false
            command: cargo test -p adabraka-gpui --test real_visual_smoke --features test-support --locked -- --ignored

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        if: runner.os == 'Linux' && matrix.linux-native
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwayland-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: gpui-${{ matrix.cache-key }}

      - name: Check GPUI feature combination
        run: ${{ matrix.command }}

      - name: Check public examples
        if: matrix.examples
        run: cargo check -p adabraka-gpui --examples --locked
