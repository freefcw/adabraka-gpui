[package]
edition = "2024"
name = "adabraka-gpui"
version = "0.7.0"
authors = ["Adabraka Team"]
build = "build.rs"
publish = true
description = "GPU-accelerated UI framework with system tray, global hotkeys, notifications, and daemon mode support (fork of Zed's GPUI)"
homepage = "https://github.com/freefcw/adabraka-gpui"
readme = "README.md"
keywords = [
    "gui",
    "desktop",
    "tray",
    "gpu",
    "daemon",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/freefcw/adabraka-gpui"

[features]
accessibility = [
    "dep:accesskit_macos",
    "dep:accesskit_unix",
    "dep:accesskit_windows",
]
default = [
    "accessibility",
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
    "image-default-formats",
    "image-rayon",
]
image-default-formats = [
    "image-format-avif",
    "image-format-bmp",
    "image-format-dds",
    "image-format-exr",
    "image-format-farbfeld",
    "image-format-gif",
    "image-format-hdr",
    "image-format-ico",
    "image-format-jpeg",
    "image-format-png",
    "image-format-pnm",
    "image-format-qoi",
    "image-format-tga",
    "image-format-tiff",
    "image-format-webp",
]
image-format-avif = ["image/avif"]
image-format-bmp = ["image/bmp"]
image-format-dds = ["image/dds"]
image-format-exr = ["image/exr"]
image-format-farbfeld = ["image/ff"]
image-format-gif = ["image/gif"]
image-format-hdr = ["image/hdr"]
image-format-ico = ["image/ico"]
image-format-jpeg = ["image/jpeg"]
image-format-png = ["image/png"]
image-format-pnm = ["image/pnm"]
image-format-qoi = ["image/qoi"]
image-format-tga = ["image/tga"]
image-format-tiff = ["image/tiff"]
image-format-webp = ["image/webp"]
image-rayon = ["image/rayon"]
inspector = ["gpui_macros/inspector"]
input-latency-histogram = ["dep:hdrhistogram"]
leak-detection = ["backtrace"]
runtime_shaders = []
screen-capture = ["scap"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "rand",
    "util/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
]
wayland = [
    "bitflags",
    "bytemuck",
    "ashpd/wayland",
    "cosmic-text",
    "font-kit",
    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "wayland-scanner",
    "filedescriptor",
    "xkbcommon",
    "open",
    "wgpu",
]
windows-manifest = []
x11 = [
    "bytemuck",
    "ashpd",
    "cosmic-text",
    "font-kit",
    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon",
    "xim",
    "x11-clipboard",
    "filedescriptor",
    "open",
    "scap?/x11",
    "wgpu",
]

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = false

